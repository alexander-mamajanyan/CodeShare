<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <meta name="color-scheme" content="dark">
    <title>Python editor</title>
    <style>
        :root {
            color-scheme: dark;
            font-family: sans-serif;
            background: #0B1020;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #0B1020;
        }

        body {
            display: flex;
            flex-direction: column;
        }

        #editor {
            flex: 1;
            min-height: 0;
            overflow: auto;
        }

        .cm-editor {
            min-height: 100%;
        }

        .key-row {
            display: flex;
            gap: 7px;
            overflow-x: auto;
            padding: 9px 10px;
            background: #151D30;
            border-top: 1px solid #29344B;
            scrollbar-width: none;
        }

        .key-row::-webkit-scrollbar {
            display: none;
        }

        .key-row button {
            flex: 0 0 auto;
            min-width: 42px;
            height: 36px;
            border: 1px solid #34415D;
            border-radius: 10px;
            padding: 0 11px;
            color: #F5F7FF;
            background: #1C2740;
            font: 14px monospace;
        }

        .key-row button:active {
            background: #34415D;
        }
    </style>
</head>
<body>
    <div id="editor"></div>
    <div class="key-row" aria-label="Python coding keys">
        <button type="button" data-insert="    ">Tab</button>
        <button type="button" data-wrap="(|)">( )</button>
        <button type="button" data-wrap="[|]">[ ]</button>
        <button type="button" data-insert=":">:</button>
        <button type="button" data-insert=" = ">=</button>
        <button type="button" data-insert=" -> ">-&gt;</button>
        <button type="button" data-insert="#">#</button>
        <button type="button" data-wrap="&quot;|&quot;">&quot; &quot;</button>
    </div>
    <script src="code-editor.js"></script>
</body>
</html>
